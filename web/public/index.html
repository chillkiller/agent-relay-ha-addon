<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Agent Relay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ═══════════ Sidebar (DNA: Nav klein oben → Räume → Projekte → Team → Identity) ═══════════ -->
    <aside id="sidebar">
      <header class="side-head">
        <div class="brand"><span class="brand-glyph">⌁</span><span id="brandName">Agent Relay</span></div><div style="display:flex;gap:4px;margin-left:auto">
            <button id="themeToggle" title="Tag/Nacht umschalten" aria-label="Tag/Nacht">🌙</button>
            <button id="sideCollapse" title="Seitenleiste zu" aria-label="Seitenleiste zu">‹</button>
          </div>
      </header>

      <!-- Views: kleine Nav-Zeile OBEN (Control-UI-Style, nicht einklappbar) -->
      <nav class="nav" id="mainNav" aria-label="Hauptnavigation">
        <button class="nav-btn" data-view="chat"><span class="nav-ico">💬</span>Räume</button>
        <button class="nav-btn" data-view="agents"><span class="nav-ico">🤖</span>Agents</button>
        <button class="nav-btn" data-view="projects"><span class="nav-ico">🗂</span>Projekte</button>
        <button class="nav-btn" data-view="settings"><span class="nav-ico">⚙️</span>Einstellungen</button>
        <button class="nav-btn" data-view="dashboard"><span class="nav-ico">📊</span>Übersicht<span class="nav-badge" id="dashBadge" hidden></span></button>
      </nav>

      <!-- RÄUME + PROJEKTE: der Haupt-Inhalt (renderRoomList befüllt) -->
      <div class="roomscroll" id="roomScroll">
        <div id="navGroups"></div>
      </div>

      <!-- Team (Facepile + Presence) -->
      <div class="roster" id="roster">
        <div class="roster-title">TEAM</div>
        <div class="roster-list" id="rosterList"></div>
        <button id="newAgentQuick" class="roster-add" title="Neuen Agent anlegen">＋ Agent</button>
      </div>

      <!-- Identity-Card mit User-Dropdown (unten-links, öffnet nach oben) -->
      <footer class="side-foot" id="sideFoot">
        <button class="identity" id="identityCard" aria-haspopup="menu" aria-expanded="false" title="Menü (Settings/Admin)">
          <span class="avatar" style="background:var(--accent)">G</span>
          <span class="identity-meta">
            <span class="identity-name">GaRoN</span>
            <span class="identity-sub"><span class="dot" id="connDot" aria-hidden="true"></span> <span id="connText">verbinde…</span></span>
          </span>
          <span class="chev">▴</span>
        </button>
        <div class="user-menu" id="userMenu" role="menu" hidden>
          <div class="menu-head">Einstellungen</div>
          <button data-user-act="settings">⚙️ Einstellungen</button>
          <button data-user-act="agents">🤖 Agents verwalten</button>
          <button data-user-act="projects">🗂 Projekte</button>
          <div class="menu-sep"></div>
          <button data-user-act="notify" id="notifyToggle">🔔 Benachrichtigungen: aus</button>
        </div>
        <button id="newRoomBtn" class="mini-cta" title="Neuen Raum anlegen">＋</button>
      </footer>
    </aside>

    <!-- ═══════════ Main ═══════════ -->
    <main id="main">
      <!-- Räume (Chat + Projekt-Board als Tabs) -->
      <section class="view" id="view-chat">
        <header class="chat-head">
          <div class="chat-head-row">
            <button id="burger" class="icon-btn" aria-label="Menü">☰</button>
            <span class="room-ico" id="activeRoomIco">#</span>
            <h2 id="activeRoomName">Kein Raum gewählt</h2>
            <nav class="room-tabs" id="roomTabs" aria-label="Raumansichten" style="display:none">
              <button class="room-tab active" data-tab="chat">Chat</button>
              <button class="room-tab" data-tab="board">Board<span class="tab-badge" id="boardBadge" hidden></span></button>
            </nav>
            <button id="memberAdd" class="icon-btn" title="Agent einladen" aria-haspopup="true">＋</button>
            <button id="roomMenu" class="icon-btn" title="Raummenü" aria-haspopup="true">⋯</button>
            <input id="searchInput" class="search-input" placeholder="Suche im Raum…" aria-label="Chat durchsuchen" />
          </div>
          <div class="member-row">
            <div class="member-chips" id="memberChips"></div>
            <div class="typing" id="typingBar" aria-live="polite"></div>
          </div>
        </header>

        <div class="messages" id="messages" tabindex="0"></div>

        <!-- "N neu ↓"-Pill (Matrix-11, OpenClaw Follow-Scroll) -->
        <button type="button" class="new-below-pill" id="newBelowPill" hidden>0 neu · ↓</button>

        <!-- Board-Tab-Fläche (Projekt-Räume) -->
        <div class="inline-board" id="inlineBoard" hidden></div>

        <div class="pinned-banner" id="pinnedBanner" hidden></div>
        <div class="approval-banner" id="approvalBanner" hidden></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="mention-pop" id="mentionPop" hidden></div>
          <textarea id="composerInput" rows="1" placeholder="Nachricht in den Raum…  (@Agent ruft gezielt auf)" aria-label="Nachricht"></textarea>
          <div class="thread-chip" id="threadChip" hidden><span class="tc-label"></span><button type="button" class="tc-x" aria-label="Thread verlassen">✕</button></div>
          <input type="file" id="composerFiles" multiple hidden />
          <button type="button" id="composerAttach" title="Dateien anhängen" aria-label="Dateien anhängen">📎</button>
          <button type="submit" id="composerSend" title="Senden" aria-label="Senden" disabled>➤</button>
        </form>
      </section>

      <!-- Agents (Team-Verwaltung) -->
      <section class="view" id="view-agents" hidden>
        <header class="view-head">
          <!-- Mobile-Back (GaRoN-Feedback 09:38): Burger/← in jeder Vollansicht,
               nicht nur im chat-head — kein Sackgassen-Layout mehr -->
          <button class="icon-btn view-back" aria-label="Zurück zu den Räumen">←</button>
          <h2>Agents</h2>
          <button id="newAgentBtn" class="btn primary">＋ Agent anlegen</button>
        </header>
        <div class="cards" id="agentCards"></div>
      </section>

      <!-- Projekte (Launcher) -->
      <section class="view" id="view-projects" hidden>
        <header class="view-head">
          <button class="icon-btn view-back" aria-label="Zurück zu den Räumen">←</button>
          <h2>Projekte</h2>
          <button id="newProjectBtn" class="btn primary">＋ Projekt-Raum</button>
        </header>
        <div class="proj-grid" id="projectList"></div>
      </section>

      <!-- Einstellungen -->
      <section class="view" id="view-dashboard" hidden>
        <header class="view-head">
          <button class="icon-btn view-back" aria-label="Zurück zu den Räumen">←</button>
          <h2>Übersicht</h2>
          <span class="hint" id="dashStamp"></span>
        </header>
        <div class="dash-grid" id="dashGrid"></div>
      </section>

      <section class="view" id="view-settings" hidden>
        <header class="view-head">
          <button class="icon-btn view-back" aria-label="Zurück zu den Räumen">←</button>
          <h2>Einstellungen</h2>
        </header>
        <form class="settings" id="settingsForm" autocomplete="off">
          <fieldset>
            <legend>Allgemein</legend>
            <label>Relay-Name <input name="relayName" placeholder="Agent Relay" /></label>
          </fieldset>
          <fieldset>
            <legend>LLM-Gateway</legend>
            <label>Basis-URL (OpenAI-kompatibel)
              <input name="openclawBaseUrl" placeholder="http://127.0.0.1:18789/v1" />
            </label>
            <label>Gateway-Token <span class="lab-hint">(write-only — leer lassen = unverändert)</span>
              <input name="openclawToken" type="password" placeholder="••••••" />
            </label>
            <p class="hint">Agents mit leerer eigener Basis-URL erben diese Einstellung. Für die native OpenClaw-Anbindung: Raum-Agent mit Adapter <code>openclaw</code> und URL <code>ws://&lt;gateway&gt;:18789</code>.</p>
          </fieldset>
          <div class="settings-foot">
            <button class="btn primary" type="submit">Speichern</button>
            <span id="settingsSaved" class="okmark" role="status"></span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- Menü-Layer + Modal -->
  <div id="popLayer" hidden></div>
  <div id="modalWrap" class="modal-wrap" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>

  <script src="app.js"></script>
</body>
</html>
