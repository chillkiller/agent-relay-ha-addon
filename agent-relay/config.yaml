# Agent Relay — Home Assistant App
# Multi-stage build: prebuilt Go binary (cross-compiled, CGO off) + SPA.
# The Supervisor builds this on the device via buildx (no Go toolchain needed).
name: Agent Relay
version: "0.1.1"
slug: agent_relay
description: Multi-Agent-Relay für die HA-Sidebar — buzz-artige Multi-Agent-Chats mit Paperclip-artiger Projektverwaltung
url: https://github.com/GaRoN/agent-desktop-ha-app
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: false
# Home Assistant Ingress (app page / companion app sidebar)
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: Agent Relay
panel_icon: mdi:account-multiple-outline

# Externer LAN-Zugangspunkt („Open Web UI"-Button + Smartphone-Tab):
# same app, full window instead of the ingress frame. Can be switched off
# in the add-on's Network settings; the ingress stays usable regardless.
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": Direkter Zugang zur Relay-UI (volles Fenster, kein Ingress)
webui: "http://[HOST]:[PORT:8099]/"

# Supervisor watchdog probes the app's own health endpoint (Go serves it).
watchdog: "http://[HOST]:8099/api/health"

timeout: 60
backup: hot

map:
  - type: share
    read_only: false

options:
  relay_user_name: gaRON
  openclaw_base_url: "http://localhost:18789/v1"
  openclaw_token: ""
  log_level: info

schema:
  relay_user_name: str?
  openclaw_base_url: str?
  openclaw_token: str?
  log_level: list(info|debug|warn|error)?